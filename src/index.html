<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imageo</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="header"></header>

    <main>
      <section class="hero">
        <div class="container">
          <div class="hero-wrapper">
            <h1 class="visually-hidden">Free images</h1>

            <svg class="svg-title" width="650" height="200">
              <use href="./img/sprite.svg#text"></use>
            </svg>

            <form class="form">
              <label>
                <input
                  type="text"
                  name="search-text"
                  placeholder="Search"
                  required
                />
              </label>
              <button type="submit">
                <svg width="25" height="25">
                  <use href="./img/sprite.svg#search"></use>
                </svg>
              </button>
            </form>

            <ul class="gallery"></ul>

            <div class="load-btn-wrapper">
              <button type="button" class="load-more-btn">Load more</button>
            </div>
          </div>
        </div>
      </section>

      <section class="reasons">
        <div class="container">
          <div class="reason-wrapper">
            <ul class="reason-list">
              <li class="reason-item">
                <h2 class="reason-title">
                  Free high <span class="reason-gradient">Quality</span> images
                  and photos.
                </h2>
              </li>
              <li class="reason-item">
                <h2 class="reason-title">High Resolution</h2>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <section class="categories">
        <div class="container">
          <h2 class="category-title">Many categories.</h2>

          <ul class="category-list">
            <li class="category-item">
              <img
                src="./img/webp/category1.png"
                alt="Category of image"
                width="250"
                height=""
              />
            </li>
            <li class="category-item">
              <img
                src="./img/webp/category2.png"
                alt="Category of image"
                width="280"
                height=""
              />
            </li>
            <li class="category-item">
              <img
                src="./img/webp/category3.png"
                alt="Category of image"
                width="310"
                height=""
              />
            </li>
            <li class="category-item">
              <img
                src="./img/webp/category4.png"
                alt="Category of image"
                width="340"
                height=""
              />
            </li>
          </ul>
        </div>
      </section>

      <span class="loader"></span>
    </main>

    <footer class="footer"></footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
